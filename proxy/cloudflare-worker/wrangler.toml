name = "reckton-stock-proxy"
main = "worker.js"
compatibility_date = "2026-06-20"

[vars]
CACHE_TTL_SECONDS = "55"
BATCH_CACHE_TTL_SECONDS = "12"
FX_CACHE_TTL_SECONDS = "3600"
FINNHUB_BASE_URL = "https://finnhub.io/api/v1"
PROFILE_CACHE_TTL_SECONDS = "86400"
HISTORY_CACHE_TTL_SECONDS = "21600"
STALE_QUOTE_TTL_SECONDS = "86400"
SUPPLEMENT_RETRY_TTL_SECONDS = "900"
QUOTE_RETRY_TTL_SECONDS = "20"
QUOTE_REQUEST_GAP_MS = "350"
